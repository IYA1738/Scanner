<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="选择 Scanner 业务模块，开始工作。" />
    <title>工作台 · Scanner</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/portal.css" />
  </head>
  <body class="portal workspace-page">
    <header class="portal-header">
      <div class="portal-header-content">
        <a class="portal-brand" href="/workspace.html" aria-label="Scanner 工作台">
          <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path d="M5 10V5h5m8 0h5v5m0 8v5h-5m-8 0H5v-5M9 14h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Scanner</span>
        </a>
        <a class="back-to-login" href="/">返回登录 <span aria-hidden="true">↗</span></a>
      </div>
    </header>

    <main class="workspace-main">
      <header class="workspace-intro">
        <span class="preview-badge">前端预览</span>
        <h1>你的工作台。</h1>
        <p>选择一个模块，开始工作。</p>
      </header>

      <section class="modules-section">
        <header class="modules-heading">
          <h2>全部模块</h2>
          <span>1 个模块</span>
        </header>
        <div class="module-grid">
          <a class="module-card" href="/modules/scanner/">
            <article>
              <header class="module-card-header">
                <svg class="module-icon" viewBox="0 0 56 56" fill="none" aria-hidden="true">
                  <rect width="56" height="56" rx="16" fill="currentColor" opacity=".08" />
                  <path d="M17 23v-6h6m10 0h6v6m0 10v6h-6m-10 0h-6v-6M14 28h9l3-6 5 12 3-6h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="module-category">业务模块</span>
              </header>
              <h3>扫链事件</h3>
              <p>实时查看扫链服务推送的事件，掌握最新链上动态。</p>
              <footer>进入模块 <span aria-hidden="true">↗</span></footer>
            </article>
          </a>
        </div>
      </section>
    </main>

    <footer class="portal-footer">
      <span>Scanner</span>
      <span>前端预览</span>
    </footer>
  </body>
</html>
